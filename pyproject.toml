# Minimal PEP 517/518 build configuration. Project metadata still lives in
# setup.py (the single source of truth, which derives the version from
# lifton/__init__.py). This block only makes `python -m build` deterministic
# and pins the build backend.
#
# The former `setuptools<81` cap existed only for the `cigar` dependency, whose
# sdist imported the removed `pkg_resources`. `cigar` was dropped in v1.0.10
# (its parsing lives in lifton/coreutils.py), so the cap is gone with it and
# LiftOn builds against current setuptools.
[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "fault: focused injected-failure and signal-safety tests",
    "fault_stress: longer repeated fault-injection tests (run explicitly)",
]
