name: Run tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up redundant
# full builds (including the chr22 example).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest only. macOS-ARM is deliberately DEFERRED: parasail and mappy
    # need conda on macOS/ARM (pip install parasail fails to build from source
    # there — see CLAUDE.md "Environment & commands"), which the GitHub-hosted
    # pip-based runner can't provide. Adding a conda-based mac job is future work.
    runs-on: ubuntu-latest
    # Cap the job so a hung wget/test fails fast instead of burning the 6h default.
    timeout-minutes: 240
    # Multi-Python matrix: prove the suite (incl. the byte-identity contract) on
    # every supported interpreter. fail-fast: false so one version's failure
    # doesn't cancel the others' diagnostics. Floor 3.10 matches setup.py
    # python_requires='>=3.10' (the networkx>=3.3 dependency requires >=3.10, and
    # 3.9 is EOL); 3.11 mirrors lifton.yml. cache: pip is keyed per python-version.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    # checkout@v6 / setup-python@v6 are the Node24-native majors (v4/v5 declared
    # Node20 — deprecated 2025-09-19, force-migrated to Node24 on runners
    # 2026-06-16, removed fall 2026); bumping now clears the deprecation warning
    # and is future-proof. cache: pip restores ~/.cache/pip (keyed on setup.py)
    # for the core test dependencies. Optional bindings have a separate job.
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: setup.py
    - name: Install dependencies
      run: |
        # The `cigar` dependency (0.1.3, sdist-only, unmaintained since 2015)
        # was DROPPED in v1.0.10 — its setup.py ran ez_setup.use_setuptools(),
        # downloading a setuptools egg from a URL that no longer serves one, so
        # any clean `pip install lifton` failed. LiftOn parses CIGAR strings
        # itself now (lifton/coreutils.py), which is why this step no longer
        # pins setuptools or pre-builds anything with --no-build-isolation.
        python -m pip install --upgrade pip setuptools wheel flake8
        # hypothesis backs the 3 property/vulnerability test files (imported at
        # module scope); installing it lets CI run the FULL suite with no
        # --ignore. Not a runtime dep, so kept out of setup.py install_requires.
        python -m pip install hypothesis
        # gffread: the GTF-conversion tests need it natively.
        # No zlib1g-dev here: since v1.0.13 mappy is an optional extra and this
        # job asserts it is absent; the optional-native job installs zlib itself.
        sudo apt-get install -y wget gffread
        wget --tries=3 --timeout=30 https://github.com/lh3/miniprot/releases/download/v0.13/miniprot-0.13_x64-linux.tar.bz2
        tar xvf miniprot-0.13_x64-linux.tar.bz2
        cp miniprot-0.13_x64-linux/miniprot /usr/local/bin
        rm -rf miniprot-0.13_x64-linux*
        wget --tries=3 --timeout=30 https://github.com/lh3/minimap2/releases/download/v2.28/minimap2-2.28_x64-linux.tar.bz2
        tar xvf minimap2-2.28_x64-linux.tar.bz2
        mv minimap2-2.28_x64-linux/k8  minimap2-2.28_x64-linux/paftools.js  minimap2-2.28_x64-linux/minimap2 /usr/local/bin
        rm -rf minimap2-2.28_x64-linux*
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Install lifton
      run: |
        python -m pip install --no-cache-dir -e ".[test]"
        python -c "import importlib.util; assert importlib.util.find_spec('mappy') is None"
    - name: Supply-chain audit (pip-audit, non-blocking)
      # Surface known CVEs in the installed dependency tree WITHOUT gating CI:
      # continue-on-error so a freshly-disclosed advisory in a transitive dep
      # (bioconda/conda-forge wheels we don't control) is visible in the run
      # summary but never blocks a merge or a release. Promote to blocking later
      # if the dependency surface stabilises.
      continue-on-error: true
      run: |
        python -m pip install pip-audit
        pip-audit || true
    - name: Run pytest (full suite incl. 24-cell byte-identity matrix)
      # ====================================================================
      # LOAD-BEARING BYTE-IDENTITY CONTRACT — tests/test_native_matrix.py
      # ::TestFullNativeMatrix::test_all_24_combinations_byte_identical
      # pins that every --stream x --inmemory-liftoff x --threads{1,2,4} x
      # --native combination (24 cells) reproduces the default output GFF3
      # byte-for-byte. This is the defining contract of the codebase; any
      # change touching the alignment kernel, writer, ID-formation, or
      # per-locus result shape MUST keep this green. Do not weaken this step.
      # ====================================================================
      # The 24-cell matrix + the parallelism/promotion gates + the
      # unit/integration suite + the 3 hypothesis-backed property/vulnerability
      # files (hypothesis installed above) — the complete collected suite with
      # no ignored test paths. Do not pin a test count here: focused regression
      # coverage is intentionally added over time. pytest comes from the [test]
      # extra (installed with lifton above); hermetic fixtures monkeypatch
      # minimap2/miniprot, so the suite needs neither. Perf tests under
      # tests/perf/ are marker-gated (registered in conftest; they do not run
      # here).
      run: |
        pytest tests/ -q
    - name: Test using example from test dir
      run: |
        cd test && bash -xeu lifton_chr22_example.sh

  optional-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the explicitly requested binding
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev
          python -m pip install --upgrade --no-cache-dir pip
          python -m pip install --no-cache-dir -e '.[test,native]'
          python -c "import mappy; from lifton.native_bindings import is_mappy_available; assert is_mappy_available()"
      - name: Execute genuine binding and fallback regressions
        run: python -m pytest tests/test_native_bindings.py tests/test_native_align_features.py -q
