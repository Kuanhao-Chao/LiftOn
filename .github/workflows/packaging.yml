name: Qualify distribution artifacts

on:
  push:
    branches: ["*"]
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: metadata
        name: Read the single-source version
        run: |
          python - <<'PY'
          import os, re, runpy
          version = runpy.run_path('lifton/__init__.py')['__version__'].lstrip('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Build and validate both distributions
        run: |
          python -m pip install --upgrade --no-cache-dir pip build twine
          python -m build
          twine check dist/*
          sha256sum dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  compiler-free:
    needs: build
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.14"]
        extension: ["whl", "tar.gz"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: /tmp/lifton-artifacts
      - name: Install without cache or compiler, outside source
        working-directory: /tmp
        run: |
          python -m venv /tmp/lifton-installed
          /tmp/lifton-installed/bin/python -m pip install --upgrade --no-cache-dir pip
          /tmp/lifton-installed/bin/python -m pip install --no-cache-dir --report /tmp/lifton-install.json /tmp/lifton-artifacts/*.${{ matrix.extension }}
          /tmp/lifton-installed/bin/python "$GITHUB_WORKSPACE/tests/packaging_smoke.py" --work-dir /tmp/lifton-smoke --expected-version '${{ needs.build.outputs.version }}' --expect-mappy absent --compiler-free
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-free-${{ matrix.python }}-${{ matrix.extension }}
          path: |
            /tmp/lifton-install.json
            /tmp/lifton-smoke/evidence.json

  native-artifact:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: /tmp/lifton-artifacts
      - name: Supply pinned external executables
        working-directory: /tmp
        run: |
          mkdir -p /tmp/lifton-tools
          wget --tries=3 --timeout=30 https://github.com/lh3/miniprot/releases/download/v0.13/miniprot-0.13_x64-linux.tar.bz2
          tar xf miniprot-0.13_x64-linux.tar.bz2
          cp miniprot-0.13_x64-linux/miniprot /tmp/lifton-tools/
          wget --tries=3 --timeout=30 https://github.com/lh3/minimap2/releases/download/v2.28/minimap2-2.28_x64-linux.tar.bz2
          tar xf minimap2-2.28_x64-linux.tar.bz2
          cp minimap2-2.28_x64-linux/minimap2 /tmp/lifton-tools/
          echo /tmp/lifton-tools >> "$GITHUB_PATH"
      - name: Run fresh lifts from the installed wheel
        working-directory: /tmp
        run: |
          python -m venv /tmp/lifton-installed
          /tmp/lifton-installed/bin/python -m pip install --upgrade --no-cache-dir pip
          /tmp/lifton-installed/bin/python -m pip install --no-cache-dir /tmp/lifton-artifacts/*.whl
          /tmp/lifton-installed/bin/python "$GITHUB_WORKSPACE/tests/packaging_smoke.py" --work-dir /tmp/lifton-smoke --expected-version '${{ needs.build.outputs.version }}' --expect-mappy absent --native-lift
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-artifact-evidence
          path: /tmp/lifton-smoke/
