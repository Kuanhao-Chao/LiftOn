# Dependabot configuration for the LiftOn repo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Two ecosystems are watched weekly:
#   * pip            — the Python runtime/build deps declared in setup.py /
#                      pyproject.toml (install_requires + the build-system pin).
#   * github-actions — the action versions pinned in .github/workflows/*.yml
#                      (checkout, setup-python, upload/download-artifact,
#                      gh-action-pypi-publish, etc.).
#
# NOTE: pyproject.toml deliberately caps setuptools<81 (cigar 0.1.3's sdist
# imports the removed pkg_resources). A PR raising that ceiling WILL re-break
# the cigar build. This warning alone was not enough — PR #55 raised it to
# >=83,<84 and was merged — so setuptools is now in the `ignore` list below,
# and tests/test_packaging_metadata.py asserts the cap independently. Drop
# both guards only once cigar stops importing pkg_resources upstream.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      # See the note above: the <81 cap is load-bearing for the cigar build.
      - dependency-name: "setuptools"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
