# Dependabot configuration for the LiftOn repo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Two ecosystems are watched weekly:
#   * pip            — the Python runtime/build deps declared in setup.py /
#                      pyproject.toml (install_requires + the build-system pin).
#   * github-actions — the action versions pinned in .github/workflows/*.yml
#                      (checkout, setup-python, upload/download-artifact,
#                      gh-action-pypi-publish, etc.).
#
# NOTE: pyproject.toml used to cap setuptools<81 for the `cigar` dependency,
# whose sdist imported the removed pkg_resources. `cigar` was dropped in
# v1.0.10 (LiftOn parses CIGAR strings itself), so the cap and the setuptools
# ignore-rule that protected it are both gone — setuptools bumps are ordinary
# updates again.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      # `docs/requirements.txt` is a fully pinned Sphinx toolchain, and Sphinx
      # 9.1 declares `docutils<0.23,>=0.21`. Bumping docutils on its own makes
      # the documentation build unresolvable, which is exactly what PR #68 did
      # -- it merged green and then every Pages deploy failed at install time.
      # Raise this ceiling only together with the Sphinx pin.
      - dependency-name: "docutils"
        versions: [">=0.23"]
      # `sphinx-panels` has been unmaintained since 2021 and 0.6.0 declares
      # `sphinx<5`, so bumping it makes the same toolchain unresolvable -- PR
      # #66 did exactly that. 0.4.1 requires `sphinx` without a ceiling and is
      # the version the last successful deploy used. The docs still use its
      # `dropdown` directive in 15 places, so it cannot simply be dropped;
      # replacing it with `sphinx-design` is the real fix and is not a
      # dependency bump.
      - dependency-name: "sphinx-panels"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
